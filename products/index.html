<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Responsive layout for mobile and desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Insplash | PRODUCTS</title>

    <!-- Favicon-->
    <link rel="icon" href="../assets/favicon/favicon.ico">

    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <ul class="breadcrumb__inner">
            <li class="breadcrumb__item">
                <a href="/" class="breadcrumb__link">Top</a>
            </li>
            <li class="breadcrumb__item" aria-current="page">
                Products
            </li>
        </ul>
    </nav>

    <!-- Product list -->
    <main>
        <!-- Filter UI section -->
        <section class="filter">
            <!-- Main filter -->
            <select name="main-filter" id="main-filter">
                <option value="">-- Select Main --</option>
                <option value="all">All</option>
                <option value="genre">Genre</option>
                <option value="language">Language</option>
                <option value="developer">Developer</option>
            </select>

            <!-- Sub filter -->
            <select name="sub-filter" id="sub-filter">
                <option value="">-- Select Sub --</option>
                <!-- ここはあとでJSでmain-filterに応じてoptionを差し替える-->
            </select>
        </section>

        <!-- Card UI section -->
        <section class="products"></section>
    </main>

    <script src="js/product-cards.js"></script>
</body>
</html>
